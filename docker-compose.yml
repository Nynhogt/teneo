services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teneo_development}
      POSTGRES_USER: ${POSTGRES_USER:-teneo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      RAILS_ENV: development
      SECRET_KEY_BASE: development-only-secret-key-base-change-before-deploying
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-teneo_development}
      POSTGRES_USER: ${POSTGRES_USER:-teneo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    ports:
      - "${API_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy

  analytics:
    build:
      context: ./services/analytics
    restart: unless-stopped
    environment:
      PORT: 8080
    ports:
      - "${ANALYTICS_PORT:-8080}:8080"

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
